version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  # Rust/Cargo dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Breaks the Linux build against rust-ini 0.21.3 (see the pin in
      # src-tauri/Cargo.toml). Later releases are still proposed.
      - dependency-name: tauri-plugin-deep-link
        versions: ["2.6.2"]
