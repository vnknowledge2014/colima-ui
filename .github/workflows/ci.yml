name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Lint & Type Check (fast — runs first) =====
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint (dead code / unused / error-prone)
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Svelte check
        run: npm run check

      - name: CSS token gate (a var() nothing defines paints nothing)
        run: npm run check:tokens

      - name: i18n key gate (locales must agree)
        run: npm run check:i18n

      # The suite exists and is fast; without this it was never enforced
      # anywhere — not here, not in the pre-push hook.
      - name: Unit tests (vitest)
        run: npm test

  # ===== Rust Check (all platforms) =====
  rust-check:
    name: Rust Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x86
            runner: ubuntu-latest
            target: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check
        working-directory: src-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo check --target ${{ matrix.target }}
          else
            cargo check
          fi

      - name: cargo clippy (dead code / unused — errors on any warning)
        working-directory: src-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
          else
            cargo clippy --all-targets --all-features -- -D warnings
          fi

      # Native runner only: a cross-compiled target cannot execute its tests.
      # Integration tests that need Docker/Trivy carry #[ignore], so a bare
      # `cargo test` runs the unit tests and skips them.
      - name: cargo test (unit)
        if: matrix.target == ''
        working-directory: src-tauri
        run: cargo test --lib

  # ===== Frontend Build =====
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ===== Aggregate gate =====
  # Branch protection on main requires a check named "ci". No job carried that
  # name, so the requirement could never be met and every merge needed --admin.
  # This job reports one verdict for the whole matrix.
  ci:
    name: ci
    if: always()
    needs: [lint, rust-check, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more CI jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
